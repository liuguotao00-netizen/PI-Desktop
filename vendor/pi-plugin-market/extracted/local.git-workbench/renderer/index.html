<!doctype html>
<html lang="zh-CN" data-booting="true">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="pi-plugin-chrome" content="v3" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file:; connect-src 'none';"
    />
    <title>Git Workbench</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <div class="shell" id="shell">
      <header class="topbar">
        <div class="repo-line">
          <span class="branch-chip" id="branchChip" title="当前分支" data-i18n-title="html.branch">
            <svg viewBox="0 0 16 16" aria-hidden="true" class="ico">
              <path
                d="M5 3.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Zm0 0v9a1.5 1.5 0 1 1-3 0v-9M5 8h3a3 3 0 0 0 3-3V3.5"
                fill="none"
                stroke="currentColor"
                stroke-width="1.2"
                stroke-linecap="round"
              />
              <circle cx="12.5" cy="2.5" r="1.3" fill="currentColor" />
            </svg>
            <span id="branchName">—</span>
          </span>
          <span class="repo-name" id="repoName"></span>
          <span class="spacer"></span>
          <span class="sync-count" id="syncCount" hidden></span>
          <button class="icon-btn" id="pullBtn" title="拉取（git pull）" aria-label="拉取" data-i18n-title="html.pullTip" data-i18n-aria="html.pull">
            <svg viewBox="0 0 16 16" aria-hidden="true" class="ico">
              <path
                d="M8 2.5v8M8 11l-3-3M8 11l3-3M3.5 13.5h9"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button class="icon-btn" id="pushBtn" title="推送（git push）" aria-label="推送" data-i18n-title="html.pushTip" data-i18n-aria="html.push">
            <svg viewBox="0 0 16 16" aria-hidden="true" class="ico">
              <path
                d="M8 13V5M8 5l-3 3M8 5l3 3M3.5 2.5h9"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button class="icon-btn" id="refreshBtn" title="刷新" aria-label="刷新" data-i18n-title="html.refresh" data-i18n-aria="html.refresh">
            <svg viewBox="0 0 16 16" aria-hidden="true" class="ico">
              <path
                d="M13 8a5 5 0 1 1-1.6-3.7M13 2v3.2H9.8"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </header>

      <!-- Two columns: the work panel on the left, the selected diff on the
           right. The splitter between them drags the diff width. -->
      <div class="split" id="split">
        <div class="pane pane-main" id="paneMain">
          <section class="composer">
            <div class="editor">
              <textarea
                id="message"
                rows="3"
                spellcheck="false"
                aria-label="提交信息"
                data-i18n-aria="html.message"
                placeholder="消息"
                data-i18n-placeholder="composer.placeholder"
              ></textarea>
              <button
                class="gen-btn"
                id="genBtn"
                title="用 AI 生成提交信息"
                aria-label="用 AI 生成提交信息"
                data-i18n-title="html.ai"
                data-i18n-aria="html.ai"
              >
                <svg viewBox="0 0 16 16" aria-hidden="true" class="ico">
                  <path
                    d="M2.5 13.5 7.6 8.4"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                  />
                  <path
                    d="M10.9 1.8 12 4.2l2.4 1.1L12 6.4l-1.1 2.4-1.1-2.4-2.4-1.1L9.8 4.2Z"
                    fill="currentColor"
                  />
                  <path
                    d="M4.1 2.6 4.6 4l1.4.5-1.4.5-.5 1.4-.5-1.4L2.2 4.5 3.6 4Z"
                    fill="currentColor"
                  />
                </svg>
              </button>
            </div>
            <div class="commit-row">
              <button class="commit-btn" id="commitBtn">
                <svg viewBox="0 0 16 16" aria-hidden="true" class="ico">
                  <path
                    d="M3 8.6 6.2 12 13 4.6"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                <span id="commitLabel" data-i18n="html.commit">提交</span>
              </button>
              <button
                class="commit-split"
                id="commitMenuBtn"
                aria-haspopup="menu"
                aria-expanded="false"
                aria-label="更多提交选项"
                data-i18n-aria="html.more"
              >
                <svg viewBox="0 0 16 16" aria-hidden="true" class="ico">
                  <path
                    d="m4.5 6.5 3.5 3.5 3.5-3.5"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.4"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
            </div>
            <div class="menu" id="commitMenu" role="menu" hidden>
              <button class="menu-item" data-menu="commit-staged" role="menuitem" data-i18n="html.menuStaged">仅提交已暂存</button>
              <button class="menu-item" data-menu="commit-all" role="menuitem" data-i18n="html.menuAll">提交全部更改</button>
              <div class="menu-sep"></div>
              <label class="menu-check"><input type="checkbox" id="optPush" /> <span data-i18n="html.menuPush">提交后立即推送</span></label>
              <label class="menu-check"><input type="checkbox" id="optSignoff" /> <span data-i18n="html.menuSignoff">添加 Signed-off-by</span></label>
            </div>
          </section>

          <div class="banner" id="banner" hidden></div>

          <main class="lists" id="lists" aria-live="polite"></main>

          <section class="history" id="history" aria-label="提交历史" data-i18n-aria="history.title">
            <header class="history-head" id="historyHead">
              <button
                class="collapse"
                id="historyToggle"
                data-collapsed="false"
                aria-expanded="true"
                aria-label="折叠或展开提交历史"
                data-i18n-aria="history.collapse"
              >
                <svg viewBox="0 0 16 16" aria-hidden="true" class="ico">
                  <path
                    d="m4.5 6.5 3.5 3.5 3.5-3.5"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.4"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
              <h2 data-i18n="history.title">提交历史</h2>
              <span class="count" id="historyCount" hidden></span>
              <div class="group-actions">
                <button class="mini" id="historyMore" hidden title="加载更多提交" aria-label="加载更多提交" data-i18n-title="history.more" data-i18n-aria="history.more">
                  <svg viewBox="0 0 16 16" aria-hidden="true" class="ico">
                    <circle cx="3.4" cy="8" r="1.15" fill="currentColor" />
                    <circle cx="8" cy="8" r="1.15" fill="currentColor" />
                    <circle cx="12.6" cy="8" r="1.15" fill="currentColor" />
                  </svg>
                </button>
              </div>
            </header>
            <div class="history-body" id="historyBody">
              <ol class="commits" id="commits"></ol>
              <div class="history-empty" id="historyEmpty" hidden></div>
              <div class="history-foot" id="historyFoot" hidden></div>
            </div>
          </section>

          <footer class="statusbar">
            <span class="status-repo" id="statusRepo"></span>
            <span class="status-last" id="statusLast"></span>
          </footer>
        </div>

        <div
          class="splitter"
          id="splitter"
          role="separator"
          aria-orientation="vertical"
          aria-label="调整差异面板宽度（双击恢复一半）"
          data-i18n-aria="html.splitter"
          aria-valuemin="180"
          tabindex="0"
          hidden
        ></div>

        <section class="pane pane-diff" id="diffPane" aria-label="文件差异" data-i18n-aria="html.diff" hidden>
          <header class="diff-head">
            <div class="diff-titles">
              <div class="diff-title" id="diffTitle"></div>
              <div class="diff-sub" id="diffSub" hidden></div>
            </div>
            <span class="diff-stat" id="diffStat" hidden></span>
            <button class="icon-btn" id="diffClose" title="关闭差异（Esc）" aria-label="关闭差异" data-i18n-title="html.diffClose" data-i18n-aria="html.diffClose">
              <svg viewBox="0 0 16 16" aria-hidden="true" class="ico">
                <path
                  d="m4 4 8 8M12 4l-8 8"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </header>
          <div class="diff-body" id="diffBody"></div>
        </section>
      </div>
    </div>

    <div class="overlay" id="overlay" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <header class="sheet-head">
          <button class="icon-btn" id="sheetBack" aria-label="返回" data-i18n-aria="html.back">
            <svg viewBox="0 0 16 16" aria-hidden="true" class="ico">
              <path
                d="M10 3 5 8l5 5"
                fill="none"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <div class="sheet-titles">
            <div class="sheet-title" id="sheetTitle"></div>
            <div class="sheet-sub" id="sheetSub"></div>
          </div>
          <button class="icon-btn" id="sheetClose" aria-label="关闭" data-i18n-aria="html.close">
            <svg viewBox="0 0 16 16" aria-hidden="true" class="ico">
              <path
                d="m4 4 8 8M12 4l-8 8"
                fill="none"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </header>
        <div class="sheet-body" id="sheetBody"></div>
        <footer class="sheet-foot" id="sheetFoot" hidden></footer>
      </div>
    </div>

    <div class="toasts" id="toasts"></div>
    <script src="panel.js"></script>
  </body>
</html>
