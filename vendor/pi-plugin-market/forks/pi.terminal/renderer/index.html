<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="pi-plugin-chrome" content="v2" />
    <title>终端</title>
    <link rel="stylesheet" href="vendor/xterm.css" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #181818;
        --surface: #212121;
        --surface-hover: color-mix(in oklab, #ffffff 6%, transparent);
        --fg: #ffffff;
        --muted: color-mix(in oklab, #ffffff 52%, transparent);
        --border: color-mix(in oklab, #ffffff 10%, transparent);
        --accent: #ffffff;
        --danger: #e5484d;
        --ok: #46a758;
      }
      :root[data-base="light"] {
        color-scheme: light;
        --bg: #ffffff;
        --surface: #f9f9f9;
        --surface-hover: color-mix(in oklab, #1a1c1f 5%, transparent);
        --fg: #1a1c1f;
        --muted: #5d5d5d;
        --border: color-mix(in oklab, #1a1c1f 10%, transparent);
        --accent: #1a1c1f;
        --danger: #d33b40;
        --ok: #2f9e44;
      }
      * { box-sizing: border-box; }
      html, body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
      }
      body { padding-top: var(--pi-plugin-titlebar-height, 0px); overflow: hidden; }
      button, select { font: inherit; color: inherit; cursor: pointer; }
      .app {
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 0;
      }
      .toolbar {
        display: flex;
        flex: 0 0 auto;
        flex-wrap: nowrap;
        overflow: hidden;
        align-items: center;
        gap: 4px;
        min-height: 34px;
        padding: 3px 8px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      .tool {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 5px;
        height: 24px;
        padding: 0 8px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        white-space: nowrap;
      }
      .tool:hover:not(:disabled) { background: var(--surface-hover); color: var(--fg); }
      .tool:disabled { opacity: 0.35; cursor: default; }
      .tool:focus-visible {
        outline: 2px solid color-mix(in oklab, var(--accent) 58%, transparent);
        outline-offset: -2px;
      }
      .tool svg { display: block; }
      .spacer { flex: 1; }
      .shell-select {
        height: 24px;
        max-width: 130px;
        padding: 0 4px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
      }
      .shell-select:hover { color: var(--fg); }
      /* 窄面板：只留图标 */
      .toolbar.compact .tool span[data-i18n] { display: none; }
      .toolbar.compact .shell-select { display: none; }

      .tabbar {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 2px;
        min-height: 30px;
        padding: 2px 6px;
        border-bottom: 1px solid var(--border);
        background: color-mix(in oklab, var(--surface) 55%, transparent);
        overflow-x: auto;
        scrollbar-width: none;
      }
      .tabbar::-webkit-scrollbar { display: none; }
      .tab {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 6px 0 10px;
        border: 1px solid transparent;
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        white-space: nowrap;
        font-size: 12px;
      }
      .tab:hover { background: var(--surface-hover); color: var(--fg); }
      .tab.active {
        border-color: var(--border);
        background: var(--surface);
        color: var(--fg);
      }
      .tab .label { pointer-events: none; }
      .tab .dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--ok);
        flex: 0 0 auto;
      }
      .tab .dot.off { background: var(--danger); }
      .tab .close {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 16px;
        height: 16px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--muted);
        padding: 0;
      }
      .tab .close:hover { background: color-mix(in oklab, var(--danger) 30%, transparent); color: var(--fg); }
      .tab .close svg { display: block; }

      .stack {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      .term-wrap {
        position: absolute;
        inset: 0;
        display: none;
        padding: 6px 0 0 8px;
      }
      .term-wrap.active { display: block; }
      .term-wrap .xterm,
      .term-wrap .xterm .xterm-viewport {
        height: 100%;
      }
      .status {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 8px;
        min-height: 26px;
        padding: 2px 10px;
        border-top: 1px solid var(--border);
        background: var(--surface);
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
      }
      .status .dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: var(--ok);
        flex: 0 0 auto;
      }
      .status .dot.off { background: var(--danger); }
      .status .cwd {
        overflow: hidden;
        text-overflow: ellipsis;
        direction: rtl;
        text-align: left;
      }
      .status .sep { opacity: 0.45; }
      .banner {
        display: none;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-bottom: 1px solid var(--border);
        background: color-mix(in oklab, var(--danger) 12%, transparent);
        color: var(--fg);
        font-size: 12px;
      }
      .banner.show { display: flex; }
      .banner .tool { color: var(--fg); border: 1px solid var(--border); border-radius: 6px; }
      #boot {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        font: 12px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
        padding: 16px;
        z-index: 2;
      }
      #boot[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="toolbar" id="toolbar">
        <button type="button" class="tool" id="btn-new" title="新建终端标签" aria-label="新建终端标签">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          <span data-i18n="newTab">新终端</span>
        </button>
        <button type="button" class="tool" id="btn-restart" title="重启当前会话" aria-label="重启当前会话">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
          <span data-i18n="restart">重启</span>
        </button>
        <button type="button" class="tool" id="btn-clear" title="清屏" aria-label="清屏">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
          <span data-i18n="clear">清屏</span>
        </button>
        <div class="spacer"></div>
        <select class="shell-select" id="shell-select" title="新标签使用的 shell"></select>
      </div>
      <div class="tabbar" id="tabbar">
        <div style="display: contents" id="tabs"></div>
      </div>
      <div class="banner" id="banner" role="status">
        <span id="banner-text"></span>
        <button type="button" class="tool" id="btn-restart-banner" data-i18n="restart">重启</button>
      </div>
      <div class="stack" id="stack">
        <div id="boot">正在连接终端…</div>
      </div>
      <div class="status">
        <span class="dot" id="dot" title="运行中"></span>
        <span id="st-shell">—</span>
        <span class="sep">·</span>
        <span class="cwd" id="st-cwd">—</span>
        <span class="sep">·</span>
        <span id="st-size">—</span>
      </div>
    </div>
    <script src="vendor/xterm.js"></script>
    <script src="vendor/addon-fit.js"></script>
    <script>
      "use strict";

      const bridge = window.pluginBridge;
      const boot = document.getElementById("boot");
      const banner = document.getElementById("banner");
      const bannerText = document.getElementById("banner-text");
      const dot = document.getElementById("dot");
      const stShell = document.getElementById("st-shell");
      const stCwd = document.getElementById("st-cwd");
      const stSize = document.getElementById("st-size");
      const stack = document.getElementById("stack");
      const tabsEl = document.getElementById("tabs");
      const tabsBar = document.getElementById("tabbar");
      const toolbarEl = document.getElementById("toolbar");
      const shellSelect = document.getElementById("shell-select");

      // ── 外观与文案 ──────────────────────────────────────────────────────
      let locale = navigator.language?.toLowerCase().startsWith("zh") ? "zh" : "en";
      let base = "dark";
      const COPY = {
        zh: {
          newTab: "新终端", restart: "重启", clear: "清屏",
          exit: "会话已结束", exitCode: "退出码", connectFail: "连接失败",
          noBridge: "pluginBridge 不可用（请在 PI-Desktop 内打开）", starting: "正在启动终端…",
          pipeWarn: "（无 PTY，降级）", shellLabel: "shell",
        },
        en: {
          newTab: "New Tab", restart: "Restart", clear: "Clear",
          exit: "Session ended", exitCode: "exit code", connectFail: "Connection failed",
          noBridge: "pluginBridge unavailable (open inside PI-Desktop)", starting: "Starting terminal…",
          pipeWarn: "(no PTY)", shellLabel: "shell",
        },
      };
      const t = (key) => COPY[locale]?.[key] ?? COPY.en[key] ?? key;

      function applyI18n() {
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          el.textContent = t(el.dataset.i18n);
        });
      }

      const themeFor = (isLight) => ({
        background: isLight ? "#ffffff" : "#181818",
        foreground: isLight ? "#1a1c1f" : "#f2f2f2",
        cursor: isLight ? "#1a1c1f" : "#f2f2f2",
        cursorAccent: isLight ? "#ffffff" : "#181818",
        selectionBackground: isLight ? "rgba(26,28,31,0.18)" : "rgba(255,255,255,0.22)",
        black: isLight ? "#1a1c1f" : "#282a2e",
        red: "#e5484d",
        green: "#46a758",
        yellow: "#dda84c",
        blue: "#52a8ff",
        magenta: "#bf7af0",
        cyan: "#5ccfe6",
        white: isLight ? "#5d5d5d" : "#b9b9b9",
        brightBlack: isLight ? "#8f8f8f" : "#6f6f6f",
        brightWhite: isLight ? "#1a1c1f" : "#ffffff",
      });

      function applyAppearance(appearance) {
        const b = appearance?.base;
        base = b === "light" || b === "dark"
          ? b
          : window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.base = base;
        const nextLocale = String(appearance?.locale ?? navigator.language).toLowerCase();
        if (nextLocale) {
          locale = nextLocale.startsWith("zh") ? "zh" : "en";
          document.documentElement.lang = locale === "zh" ? "zh-CN" : "en";
        }
        applyI18n();
        for (const tab of tabs) tab.term.options.theme = themeFor(base === "light");
      }
      bridge?.on?.("appearance:changed", applyAppearance);
      bridge?.invoke?.("app.getAppearance").then(applyAppearance).catch(() => applyAppearance(null));

      if (!bridge?.invoke) {
        boot.textContent = t("noBridge");
      }

      // ── 多标签状态 ──────────────────────────────────────────────────────
      /** 每个标签：{ sid, label, term, fit, wrapEl, tabEl, cursor, exited, info, source, sseFails, pollTimer, inputQueue } */
      const tabs = [];
      let activeTab = null;
      let streamBase = null; // { port, token }
      let shellChoices = [];
      let defaultShell = "";

      const b64ToBytes = (b64) => {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i += 1) bytes[i] = bin.charCodeAt(i);
        return bytes;
      };

      const sendInput = (tab, data) => {
        if (tab.exited) return;
        tab.inputQueue = tab.inputQueue
          .then(() => bridge.invoke("term.input", { sid: tab.sid, data }))
          .catch(() => {});
      };

      const updateStatus = () => {
        const tab = activeTab;
        const exited = Boolean(tab?.exited);
        dot.classList.toggle("off", exited || !tab);
        stShell.textContent = tab
          ? tab.info.shell.split("/").pop() + (tab.info.mode === "pipe" ? ` ${t("pipeWarn")}` : "")
          : "—";
        stCwd.textContent = tab ? tab.info.cwd : "—";
        stCwd.title = tab ? tab.info.cwd : "";
        stSize.textContent = tab ? `${tab.term.cols}×${tab.term.rows}` : "—";
        banner.classList.toggle("show", exited);
        if (tab && exited) {
          bannerText.textContent = `${t("exit")}${tab.info.exitCode != null ? ` · ${t("exitCode")} ${tab.info.exitCode}` : ""}`;
        }
      };

      const renderTabs = () => {
        tabsEl.replaceChildren();
        for (const tab of tabs) {
          tab.tabEl.querySelector(".label").textContent = tab.info.label;
          tab.tabEl.querySelector(".dot").classList.toggle("off", Boolean(tab.exited));
          tabsEl.append(tab.tabEl);
        }
      };

      const fitTab = (tab, report) => {
        if (!tab || activeTab !== tab) return;
        try {
          tab.fit.fit();
        } catch {
          return;
        }
        if (report) {
          clearTimeout(tab.resizeTimer);
          tab.resizeTimer = setTimeout(() => {
            bridge.invoke("term.resize", { sid: tab.sid, cols: tab.term.cols, rows: tab.term.rows }).catch(() => {});
          }, 120);
        }
        if (activeTab === tab) stSize.textContent = `${tab.term.cols}×${tab.term.rows}`;
      };

      const activateTab = (tab) => {
        if (!tab || activeTab === tab) return;
        activeTab = tab;
        for (const entry of tabs) {
          entry.wrapEl.classList.toggle("active", entry === tab);
          entry.tabEl.classList.toggle("active", entry === tab);
        }
        // 布局稳定后再 fit（隐藏状态下量不出尺寸）
        requestAnimationFrame(() => {
          fitTab(tab, true);
          updateStatus();
          tab.term.focus();
        });
      };

      const destroyTab = (tab) => {
        try { tab.source?.close(); } catch { /* 忽略 */ }
        clearInterval(tab.pollTimer);
        clearTimeout(tab.resizeTimer);
        try { tab.term.dispose(); } catch { /* 忽略 */ }
        tab.wrapEl.remove();
        tab.tabEl.remove();
      };

      const closeTab = async (tab) => {
        const index = tabs.indexOf(tab);
        if (index === -1) return;
        tabs.splice(index, 1);
        const wasActive = activeTab === tab;
        if (wasActive) activeTab = null;
        destroyTab(tab);
        bridge.invoke("term.close", { sid: tab.sid }).catch(() => {});
        if (tabs.length > 0) {
          activateTab(tabs[Math.max(0, index - 1)]);
        } else {
          await newTab();
        }
      };

      const makeTabEl = (tab) => {
        const el = document.createElement("button");
        el.type = "button";
        el.className = "tab";
        el.title = tab.info.label;
        const dotEl = document.createElement("span");
        dotEl.className = "dot";
        const label = document.createElement("span");
        label.className = "label";
        label.textContent = tab.info.label;
        const close = document.createElement("span");
        close.className = "close";
        close.setAttribute("role", "button");
        close.title = locale === "zh" ? "关闭" : "Close";
        close.innerHTML = '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>';
        el.append(dotEl, label, close);
        el.addEventListener("click", (event) => {
          if (event.target === close || close.contains(event.target)) {
            closeTab(tab);
          } else {
            activateTab(tab);
          }
        });
        return el;
      };

      const makeTab = (info) => {
        const wrapEl = document.createElement("div");
        wrapEl.className = "term-wrap";
        stack.append(wrapEl);

        const term = new window.Terminal({
          fontFamily: '"SF Mono", "Menlo", "Monaco", "Cascadia Mono", "Courier New", monospace',
          fontSize: 12,
          lineHeight: 1.15,
          scrollback: 5000,
          cursorBlink: true,
          theme: themeFor(base === "light"),
          convertEol: false,
        });
        const fit = new window.FitAddon.FitAddon();
        term.loadAddon(fit);
        term.open(wrapEl);

        const tab = {
          sid: info.sid,
          info: { ...info },
          term,
          fit,
          wrapEl,
          tabEl: null,
          cursor: 0,
          exited: Boolean(info.exited),
          source: null,
          sseFails: 0,
          pollTimer: 0,
          resizeTimer: 0,
          inputQueue: Promise.resolve(),
        };

        tab.tabEl = makeTabEl(tab);
        tabs.push(tab);
        renderTabs();

        term.onData((data) => sendInput(tab, data));
        term.attachCustomKeyEventHandler((event) => {
          if (event.type !== "keydown") return true;
          if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "c" && term.hasSelection()) {
            navigator.clipboard?.writeText(term.getSelection()).catch(() => {});
            return false;
          }
          if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "v") {
            navigator.clipboard?.readText()
              .then((text) => { if (text) sendInput(tab, text); })
              .catch(() => {});
            return false;
          }
          return true;
        });

        new ResizeObserver(() => fitTab(tab, true)).observe(wrapEl);
        activateTab(tab);
        // 连流由调用方负责：hello 路径先 poll 补历史再连（SSE 按同一 cursor
        // 续传，不会重复）；newTab 路径直接连。
        // 2.5s 内一帧输出都没有 → SSE 被环境拦了，强制走轮询兜底
        setTimeout(() => {
          if (tabs.includes(tab) && tab.cursor === 0 && !tab.exited && !tab.pollTimer) startPolling(tab);
        }, 2500);
        return tab;
      };

      const populateShells = (hello) => {
        shellChoices = Array.isArray(hello?.shells) ? hello.shells : [];
        defaultShell = hello?.defaultShell || shellChoices[0]?.path || "/bin/bash";
        shellSelect.replaceChildren();
        const seen = new Set();
        for (const choice of shellChoices) {
          if (seen.has(choice.path)) continue;
          seen.add(choice.path);
          const option = document.createElement("option");
          option.value = choice.path;
          option.textContent = `${choice.name} · ${choice.path}`;
          shellSelect.append(option);
        }
        if (shellSelect.options.length === 0) {
          const option = document.createElement("option");
          option.value = defaultShell;
          option.textContent = defaultShell;
          shellSelect.append(option);
        }
        shellSelect.value = seen.has(defaultShell) ? defaultShell : shellSelect.options[0]?.value || defaultShell;
      };

      const newTab = async () => {
        try {
          const dims = activeTab
            ? { cols: activeTab.term.cols, rows: activeTab.term.rows }
            : { cols: 80, rows: 24 };
          const info = await bridge.invoke("term.new", { ...dims, shell: shellSelect.value || defaultShell });
          if (info?.ok === false) throw new Error(info.message || "failed");
          const tab = makeTab(info);
          connectStream(tab);
          return tab;
        } catch (error) {
          banner.classList.add("show");
          bannerText.textContent = `${t("connectFail")}: ${error?.message ?? error}`;
          return null;
        }
      };

      // ── 输出：每条标签一条 SSE；被拦则退回轮询 ──────────────────────────
      const handlePayload = (tab, payload) => {
        let msg;
        try {
          msg = JSON.parse(payload);
        } catch {
          return;
        }
        if (msg.t === "o") {
          const bytes = b64ToBytes(msg.d);
          tab.cursor += bytes.length;
          tab.term.write(bytes);
        } else if (msg.t === "x") {
          tab.exited = true;
          tab.info.exitCode = msg.code;
          renderTabs();
          updateStatus();
        } else if (msg.t === "r") {
          tab.term.reset();
          tab.cursor = 0;
          tab.exited = false;
          renderTabs();
          updateStatus();
        }
      };

      const startPolling = (tab) => {
        if (!tabs.includes(tab) || tab.pollTimer) return;
        tab.source?.close();
        tab.source = null;
        tab.pollTimer = setInterval(async () => {
          if (document.hidden || !tabs.includes(tab)) return;
          try {
            const result = await bridge.invoke("term.poll", { sid: tab.sid, cursor: tab.cursor });
            if (result?.ok === false) return;
            if (result?.data) {
              const bytes = b64ToBytes(result.data);
              tab.cursor = result.cursor;
              tab.term.write(bytes);
            }
            if (result?.exited && !tab.exited) {
              tab.exited = true;
              tab.info.exitCode = result.exitCode;
              renderTabs();
              updateStatus();
            }
          } catch {
            /* 插件可能正在重载 */
          }
        }, 200);
      };

      const connectStream = (tab) => {
        if (!streamBase) return;
        tab.source?.close();
        try {
          tab.source = new EventSource(
            `http://127.0.0.1:${streamBase.port}/stream?token=${encodeURIComponent(streamBase.token)}&sid=${encodeURIComponent(tab.sid)}&cursor=${tab.cursor}`,
          );
        } catch {
          startPolling(tab);
          return;
        }
        tab.source.onmessage = (event) => {
          tab.sseFails = 0;
          handlePayload(tab, event.data);
        };
        tab.source.onerror = () => {
          // file:// 沙箱页连 http 回环可能被 CSP/CORS 拦下；EventSource 会
          // 自己无限重连（readyState 一直是 CONNECTING），所以按失败次数
          // 升级到轮询，绝不能只等 CLOSED。
          tab.sseFails += 1;
          if (tab.sseFails >= 3) startPolling(tab);
        };
      };

      // ── 启动 ────────────────────────────────────────────────────────────
      bridge.invoke("term.hello", {})
        .then(async (hello) => {
          if (hello?.ok === false) throw new Error(hello.message || "hello failed");
          streamBase = { port: hello.port, token: hello.token };
          populateShells(hello);
          const list = Array.isArray(hello.sessions) ? hello.sessions : [];
          for (const info of list) {
            const tab = makeTab(info);
            // 先把建会话早期输出拉回来，再交给 SSE 按 cursor 续传（不重复）
            try {
              const first = await bridge.invoke("term.poll", { sid: tab.sid, cursor: tab.cursor });
              if (first?.ok !== false && first?.data) {
                const bytes = b64ToBytes(first.data);
                tab.cursor = first.cursor;
                tab.term.write(bytes);
              }
            } catch {
              /* poll 失败不影响 SSE */
            }
            connectStream(tab);
          }
          if (tabs.length === 0) await newTab();
          boot.hidden = true;
        })
        .catch((error) => {
          boot.hidden = false;
          boot.textContent = `${t("connectFail")}: ${error?.message ?? error}`;
        });

      // ── 工具栏 ──────────────────────────────────────────────────────────
      const restartActive = async () => {
        const tab = activeTab;
        if (!tab) return;
        try {
          const result = await bridge.invoke("term.restart", {
            sid: tab.sid,
            cols: tab.term.cols,
            rows: tab.term.rows,
            shell: shellSelect.value || defaultShell,
          });
          if (result?.ok) {
            tab.info = { ...tab.info, ...result };
            tab.term.reset();
            tab.cursor = 0;
            tab.exited = false;
            renderTabs();
            updateStatus();
            tab.term.focus();
          }
        } catch {
          /* 插件可能正在重载 */
        }
      };
      document.getElementById("btn-new").addEventListener("click", () => void newTab());
      document.getElementById("btn-restart").addEventListener("click", restartActive);
      document.getElementById("btn-restart-banner").addEventListener("click", restartActive);
      document.getElementById("btn-clear").addEventListener("click", () => {
        const tab = activeTab;
        if (!tab || tab.exited) return;
        tab.term.clear();
        sendInput(tab, "\f");
        tab.term.focus();
      });

      new ResizeObserver(() => {
        toolbarEl.classList.toggle("compact", toolbarEl.clientWidth < 380);
      }).observe(toolbarEl);
      applyI18n();
    </script>
  </body>
</html>
