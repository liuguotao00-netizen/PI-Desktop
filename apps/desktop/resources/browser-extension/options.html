<html><body style="font:13px system-ui;padding:16px;min-width:320px">
<h1 style="font-size:15px">PI-Desktop Browser Bridge</h1>
<p style="font:12px system-ui;color:#666">PI-Desktop connects automatically through Chrome native messaging. The URL below is only a fallback for setups where the native host is not installed; if you use it, paste the Bridge URL from PI-Desktop Settings → Browser backend (it includes a token).</p>

<p><button id="save">Save and reconnect</button> <span id="status"></span></p>
<p id="connection" style="font:12px system-ui;color:#555"></p>

</body></html>
